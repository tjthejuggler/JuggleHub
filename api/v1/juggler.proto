syntax = "proto3";
package juggler.v1;

// 3D vector for positions, velocities, accelerations
message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

// 2D vector for pixel coordinates
message Vector2 {
  double x = 1;
  double y = 2;
}

// Color information in BGR format
message Color {
  uint32 b = 1;  // Blue component (0-255)
  uint32 g = 2;  // Green component (0-255)
  uint32 r = 3;  // Red component (0-255)
}

// HSV color range for ball detection
message HSVRange {
  Vector3 min_hsv = 1;  // Minimum HSV values
  Vector3 max_hsv = 2;  // Maximum HSV values
}

// Ball detection and tracking information
// 2D bounding box for video overlay
message BoundingBox2D {
  float x = 1;
  float y = 2;
  float width = 3;
  float height = 4;
  float confidence = 5; // Add confidence score
  int32 class_id = 6;
  string class_name = 7;
}

message Ball {
  int32 id = 1; // The raw bytetrack ID, can change. May be -1 if predicted.
  Vector3 position = 2;
  BoundingBox2D bounding_box_2d = 3; // For video overlay
  string class_name = 4;

  enum Status {
    TRACKED = 0;   // Directly observed in this frame
    PREDICTED = 1; // Position is a physics-based prediction
    OCCLUDED = 2;  // Assumed to be held in a hand
  }
  Status status = 5;

  Vector2 projected_pos_2d = 6;
  int32 logical_id = 7; // The persistent, logical ID of the ball (e.g., 0, 1, 2)
}

// Color-tracked ball (new simplified tracking system)
message ColorTrackedBall {
  int32 logical_id = 1;           // Persistent ID (0, 1, 2)
  string color_name = 2;          // Associated color profile name
  Vector2 pixel_pos = 3;          // Current 2D position
  Vector3 world_pos = 4;          // Current 3D position
  bool is_active = 5;             // Whether this tracker is currently tracking
  int32 associated_wrist_id = 6;  // -1 if not associated, 0=left, 1=right if associated
  int32 frames_since_seen = 7;    // Frames without detection
}

// Hand position and tracking
message KeyPoint {
  Vector2 pos_2d = 1;
  Vector3 pos_3d = 2;
  float confidence = 3;
}

message Hand {
  int32 id = 1;                     // 0 for left, 1 for right
  Vector2 position_2d = 2;          // 2D pixel position of the wrist
  Vector3 wrist_pos_3d = 3;         // 3D position of the wrist
  double confidence = 4;            // Detection confidence (0.0-1.0)
  bool is_visible = 5;              // Whether hand is visible
  repeated KeyPoint keypoints = 6;  // All keypoints for the hand
  string side = 7;                  // "left" or "right" for compatibility
  Vector3 position_3d = 8;          // Alias for wrist_pos_3d for compatibility
}

// IMU data from smartwatches
message IMUData {
  string watch_name = 1;            // Watch identifier
  string watch_ip = 2;              // Watch IP address
  Vector3 acceleration = 3;         // Acceleration in m/s²
  Vector3 gyroscope = 4;            // Angular velocity in rad/s
  Vector3 magnetometer = 5;         // Magnetic field (if available)
  double accel_magnitude = 6;       // Acceleration magnitude
  double gyro_magnitude = 7;        // Gyroscope magnitude
  uint64 timestamp_us = 8;          // Timestamp in microseconds
  double data_age_ms = 9;           // Age of data in milliseconds
}

// Camera intrinsics for 3D calculations
message CameraIntrinsics {
  double fx = 1;                    // Focal length X
  double fy = 2;                    // Focal length Y
  double ppx = 3;                   // Principal point X
  double ppy = 4;                   // Principal point Y
  double depth_scale = 5;           // Depth scale factor
}

// System status and diagnostics
message SystemStatus {
  bool camera_connected = 1;        // Camera connection status
  bool engine_running = 2;          // Engine process status
  double fps = 3;                   // Current FPS
  uint32 frame_count = 4;           // Total frames processed
  string mode = 5;                  // Current mode (live, playback, etc.)
  string error_message = 6;         // Error message if any
  uint64 timestamp_us = 7;          // Status timestamp
}

// Main frame data packet sent from engine to hub
message FrameData {
  uint64 timestamp_us = 1;          // Frame timestamp in microseconds
  repeated Ball balls = 2;          // Detected and tracked balls
  repeated Hand hands = 3;          // Detected hands
  repeated IMUData imu_data = 4;    // IMU data from watches
  CameraIntrinsics intrinsics = 5;  // Camera intrinsics
  SystemStatus status = 6;          // System status
  
  // Frame metadata
  uint32 frame_width = 7;           // Frame width in pixels
  uint32 frame_height = 8;          // Frame height in pixels
  uint32 frame_number = 9;          // Sequential frame number
  
  // Optional image data (base64 encoded for streaming)
  repeated BoundingBox2D raw_detections = 10; // New field
  bytes color_image_b64 = 11;      // Base64 encoded color image
  bytes depth_image_b64 = 12;      // Base64 encoded depth image
  bool ir_projector_active = 13;   // Status of the IR projector
  repeated ColorTrackedBall color_tracked_balls = 14; // New simplified color tracking
}

// Command and control API for managing engine modules
message CommandRequest {
  enum CommandType {
    UNKNOWN = 0;
    LOAD_MODULE = 1;
    UNLOAD_MODULE = 2;
    SEND_COLOR_COMMAND = 3;
    CONFIGURE_MODULE = 4; // New command type for module-specific configuration
    RECORD_START = 5;
    RECORD_CONTINUOUS_START = 6;
    RECORD_CONTINUOUS_STOP = 7;
    RESTART_WITH_CAMERA_SETTINGS = 8; // New command for camera settings
    CAMERA_STOP = 9; // Stop camera feed
    CAMERA_START = 10; // Start camera feed with settings
    CALIBRATE_OBJECT = 11; // Force-set the position of a logical tracker
    SET_POSE_MODEL_ENABLED = 12; // Enable or disable the pose model
    CALIBRATE_COLOR = 13; // Calibrate a color profile by clicking on a ball
  }
  
  CommandType type = 1;
  string module_name = 2;           // Name of the module to load/unload
  uint64 timestamp_us = 3;          // Command timestamp
  ColorCommand color_command = 4;
  map<string, string> module_args = 5; // Arguments for the module
  string camera_settings_file = 6;  // Path to camera settings JSON file
  uint32 camera_width = 7;          // Camera resolution width
  uint32 camera_height = 8;         // Camera resolution height
  uint32 camera_fps = 9;            // Camera frame rate
  
  // For CALIBRATE_OBJECT
  int32 logical_id_to_calibrate = 10;
  Vector2 calibration_pixel_pos = 11;
  bool record_with_yolo_boxes = 12;
  bool record_with_bytetrack_boxes = 13;
  bool pose_model_enabled = 14;
  
  // For CALIBRATE_COLOR
  string color_name = 15;           // Name of the color profile to calibrate
  int32 click_x = 16;               // X coordinate of the click
  int32 click_y = 17;               // Y coordinate of the click
}

message ColorCommand {
  string ball_id = 1;
  Color color = 2;
}

message CommandResponse {
  bool success = 1;                 // Whether the command was successful
  string message = 2;               // Response message (e.g., error details)
  uint64 timestamp_us = 3;          // Response timestamp
}